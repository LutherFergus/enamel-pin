<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>vector micro-match</title></head>
  <body>
    <script type="module">
      import { init, potrace } from '/node_modules/esm-potrace-wasm/dist/index.js'

      function parsePotraceTransform(attrs) {
        const tr = attrs.match(
          /translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)\s*scale\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/i,
        )
        if (!tr) return null
        return { translateY: Number(tr[2]), scale: Math.abs(Number(tr[3])), superScale: 1 }
      }
      function mapPoint(p, t) {
        return { x: (p.x * t.scale) / t.superScale, y: (t.translateY + p.y * -t.scale) / t.superScale }
      }
      function fmt(n) {
        const r = Math.round(n * 1000) / 1000
        return Object.is(r, -0) ? '0' : String(r)
      }
      function bakePotracePathD(d, t) {
        const tokens = d.match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/g)
        if (!tokens?.length) return ''
        let i = 0, cmd = '', cx = 0, cy = 0, startX = 0, startY = 0
        const out = []
        const nextNum = () => { const v = Number(tokens[i++]); return Number.isFinite(v) ? v : 0 }
        while (i < tokens.length) {
          const tok = tokens[i]
          if (/^[a-zA-Z]$/.test(tok)) { cmd = tok; i++ } else if (!cmd) break
          switch (cmd) {
            case 'M': { cx=nextNum(); cy=nextNum(); startX=cx; startY=cy; const p=mapPoint({x:cx,y:cy},t); out.push(`M${fmt(p.x)},${fmt(p.y)}`); cmd='L'; break }
            case 'm': { cx+=nextNum(); cy+=nextNum(); startX=cx; startY=cy; const p=mapPoint({x:cx,y:cy},t); out.push(`M${fmt(p.x)},${fmt(p.y)}`); cmd='l'; break }
            case 'L': case 'l': { if (cmd==='L'){cx=nextNum();cy=nextNum()} else {cx+=nextNum();cy+=nextNum()} const p=mapPoint({x:cx,y:cy},t); out.push(`L${fmt(p.x)},${fmt(p.y)}`); break }
            case 'H': case 'h': { cx = cmd==='H'?nextNum():cx+nextNum(); const p=mapPoint({x:cx,y:cy},t); out.push(`L${fmt(p.x)},${fmt(p.y)}`); break }
            case 'V': case 'v': { cy = cmd==='V'?nextNum():cy+nextNum(); const p=mapPoint({x:cx,y:cy},t); out.push(`L${fmt(p.x)},${fmt(p.y)}`); break }
            case 'C': { const x1=nextNum(),y1=nextNum(),x2=nextNum(),y2=nextNum(); cx=nextNum(); cy=nextNum(); const p1=mapPoint({x:x1,y:y1},t), p2=mapPoint({x:x2,y:y2},t), p=mapPoint({x:cx,y:cy},t); out.push(`C${fmt(p1.x)},${fmt(p1.y)} ${fmt(p2.x)},${fmt(p2.y)} ${fmt(p.x)},${fmt(p.y)}`); break }
            case 'c': { const x1=cx+nextNum(),y1=cy+nextNum(),x2=cx+nextNum(),y2=cy+nextNum(); cx+=nextNum(); cy+=nextNum(); const p1=mapPoint({x:x1,y:y1},t), p2=mapPoint({x:x2,y:y2},t), p=mapPoint({x:cx,y:cy},t); out.push(`C${fmt(p1.x)},${fmt(p1.y)} ${fmt(p2.x)},${fmt(p2.y)} ${fmt(p.x)},${fmt(p.y)}`); break }
            case 'Z': case 'z': { out.push('Z'); cx=startX; cy=startY; break }
            default: return out.join('')
          }
        }
        return out.join('')
      }
      function bakeColor(traced, fill) {
        const gMatch = traced.match(/<g\b([^>]*)>/i)
        const transform = gMatch ? parsePotraceTransform(gMatch[1]) : null
        const ds = [...traced.matchAll(/\bd="([^"]*)"/gi)].map((m) => m[1])
        if (!ds.length || !transform) return ''
        const t = { ...transform, superScale: 1 }
        return ds.map((d) => {
          const baked = bakePotracePathD(d, t)
          return baked ? `<path fill="${fill}" d="${baked}" />` : ''
        }).filter(Boolean).join('\n')
      }

      function hex(r,g,b){ return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('') }

      // Quantize to N colors via k-means-ish (simple median cut / popularity)
      function quantize(data, w, h, nColors) {
        const counts = new Map()
        for (let i=0;i<w*h;i++){
          const o=i*4
          if (data[o+3]<128) continue
          // 5-bit buckets
          const key = ((data[o]>>3)<<10)|((data[o+1]>>3)<<5)|(data[o+2]>>3)
          counts.set(key, (counts.get(key)||0)+1)
        }
        const top = [...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0, nColors*3)
        // merge close buckets into nColors
        const pals = []
        for (const [key] of top) {
          const r=((key>>10)&31)<<3, g=((key>>5)&31)<<3, b=(key&31)<<3
          let best=-1, bestD=1e9
          for (let i=0;i<pals.length;i++){
            const d=(pals[i].r-r)**2+(pals[i].g-g)**2+(pals[i].b-b)**2
            if (d<bestD){bestD=d;best=i}
          }
          if (best>=0 && bestD < 40*40 && pals.length>=nColors) {
            // skip
          } else if (pals.length < nColors) {
            pals.push({r,g,b})
          }
        }
        while (pals.length < Math.min(nColors, 8)) pals.push({r:0,g:0,b:0})
        const labels = new Uint16Array(w*h)
        for (let i=0;i<w*h;i++){
          const o=i*4
          if (data[o+3]<128){ labels[i]=0xffff; continue }
          let best=0, bestD=1e9
          for (let k=0;k<pals.length;k++){
            const d=(pals[k].r-data[o])**2+(pals[k].g-data[o+1])**2+(pals[k].b-data[o+2])**2
            if (d<bestD){bestD=d;best=k}
          }
          labels[i]=best
        }
        return { labels, pals }
      }

      window.__ready = init()
      window.__traceVector = async (pngB64, size, nColors) => {
        await window.__ready
        const img = new Image(); img.src='data:image/png;base64,'+pngB64; await img.decode()
        const w=size, h=size
        const c=document.createElement('canvas'); c.width=w; c.height=h
        const ctx=c.getContext('2d')
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h)
        ctx.drawImage(img,0,0,w,h)
        const { data } = ctx.getImageData(0,0,w,h)
        const { labels, pals } = quantize(data, w, h, nColors)

        // 1px dilate
        const dil = new Uint16Array(labels)
        for (let y=0;y<h;y++) for (let x=0;x<w;x++){
          const v=labels[y*w+x]; if (v===0xffff) continue
          for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
            const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=w||ny>=h) continue
            const ni=ny*w+nx; if (dil[ni]===0xffff) dil[ni]=v
          }
        }

        const parts = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`, '<g id="fills">']
        let pathCount=0
        // area sort later
        const pending=[]
        for (let idx=0; idx<pals.length; idx++){
          const bw = new ImageData(w,h)
          let area=0
          for (let i=0;i<w*h;i++){
            const on = dil[i]===idx
            if (on) area++
            const o=i*4, v=on?0:255
            bw.data[o]=bw.data[o+1]=bw.data[o+2]=v; bw.data[o+3]=255
          }
          if (area < 20) continue
          const traced = await potrace(bw, {
            turdsize: Math.max(2, Math.round(w*h*0.000002)),
            turnpolicy: 4,
            alphamax: 1.0,
            opticurve: 1,
            opttolerance: 0.2,
            pathonly: false,
            extractcolors: false,
          })
          const fill = hex(pals[idx].r, pals[idx].g, pals[idx].b)
          const markup = bakeColor(String(traced), fill)
          if (!markup) continue
          pathCount += (markup.match(/<path/g)||[]).length
          pending.push({ markup, area })
        }
        pending.sort((a,b)=>b.area-a.area)
        for (const p of pending) parts.push(p.markup)
        parts.push('</g></svg>')
        return { svg: parts.join('\n'), pathCount, colors: pals.length }
      }
      document.body.textContent = 'ready'
    </script>
  </body>
</html>
